# The Ethernet driver of the network adapter. Its interrupts stop on some
# consoles, and the driver then polls the chip. The receive FIFO of the chip
# is 16 KB, so the polling interval sets the receive speed: 10 ms gives
# about 1.5 MB/s, 4 ms (one kernel tick) about 4 MB/s.
options ps2-smap poll_ms=4
