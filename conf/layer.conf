BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "playstation2"
BBFILE_PATTERN_playstation2 = "^${LAYERDIR}/"
BBFILE_PRIORITY_playstation2 = "6"

LAYERDEPENDS_playstation2 = "core"
LAYERSERIES_COMPAT_playstation2 = "scarthgap"

# Version of this layer. The login banner shows it. Change it with each release.
PS2_LAYER_VERSION = "1.2 (2026-10-21)"
