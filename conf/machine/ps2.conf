#@TYPE: Machine
#@NAME: Sony PlayStation 2
#@DESCRIPTION: Machine configuration for the Sony PlayStation 2 (R5900, 32 MiB RAM)

require conf/machine/include/tune-r5900.inc

PREFERRED_PROVIDER_virtual/kernel = "linux-ps2"

# glibc refuses to start on a kernel older than this value. The kernel is 5.4.
OLDEST_KERNEL = "5.4"

# "make vmlinuz" writes a compressed ELF file. uLaunchELF can start this file.
KERNEL_IMAGETYPE = "vmlinuz"

# The kernel has no initrd loader. The build puts the root filesystem in the kernel.
INITRAMFS_IMAGE = "ps2-image-initramfs"
INITRAMFS_IMAGE_BUNDLE = "1"
INITRAMFS_FSTYPES = "cpio.gz"
# Size limit in KiB for the unpacked initramfs. The console has 32 MiB of RAM.
INITRAMFS_MAXSIZE = "12288"

# Kernel modules that /init loads at startup, in this sequence: IOP interrupts,
# USB host, keyboard and storage. iop-irq must come before ohci-ps2. The USB
# driver does not ask for it, but cannot get its interrupt without it.
PS2_INITRAMFS_MODULES ?= "iop-irq ohci-ps2 usbhid hid-generic usb-storage sd-mod"

# Kernel modules for the hard disk on the network adapter of the large
# console models. /init loads them after the USB modules. iop-dev9
# switches on the expansion bay and must come first. It fails on a console
# with nothing in the bay, and /init then skips pata-ps2.
PS2_INITRAMFS_EXTRA_MODULES ?= "iop-dev9 pata-ps2"

# /init looks for a root file system on these devices, in this order, and
# switches to the first one it finds. The swap device at the same place in
# the second list goes with it. PARTLABEL is the APA name of a partition on
# the hard disk (kernel patch 0018, "ps2-disk apa-format"). LABEL is the
# label of a file system: ps2root and ps2swap are on the USB image.
# If no device appears in PS2_ROOT_WAIT seconds, the system runs from RAM.
PS2_ROOT_DEVICE ?= "PARTLABEL=linux-root LABEL=ps2root"
PS2_SWAP_DEVICE ?= "PARTLABEL=linux-swap LABEL=ps2swap"
PS2_ROOT_WAIT ?= "20"

# The console is the frame buffer with a USB keyboard.
SERIAL_CONSOLES = ""
USE_VT = "1"

MACHINE_FEATURES = "usbhost"

# No qemu-usermode: QEMU cannot run R5900 code with the FPU tune, so a
# build that runs a target program through QEMU fails. Meson then stops
# at its compiler check ("Executables created by c compiler ... are not
# runnable"), the first of them xorgproto for the X image. Without the
# feature, Meson cross-compiles with no check, and the caches of
# fontconfig, gdk-pixbuf and the MIME database are built at the first
# boot instead of at build time.
MACHINE_FEATURES_BACKFILL_CONSIDERED += "qemu-usermode"
MACHINE_EXTRA_RRECOMMENDS = "kernel-modules"
