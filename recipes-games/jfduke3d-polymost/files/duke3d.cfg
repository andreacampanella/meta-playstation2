; Start settings for JFDuke3D (2018, Polymost renderer) on the PlayStation 2.
;
; 24 bits for each pixel selects the OpenGL renderer (the SDL2 driver reports
; its modes as 24-bit). The GS scales the
; picture to the full screen. GLTextureMode 0 is nearest filtering, the look of the original game. 1 is
; linear filtering. The library has no mipmaps.
; The game writes its other settings to this file when it stops.

[Screen Setup]
ScreenMode = 1
ScreenWidth = 320
ScreenHeight = 240
ScreenBPP = 24
GLTextureMode = 0
GLAnisotropy = 1
GLUseTextureCompr = 0
GLUseCompressedTextureCache = 0

; Sound effects through SDL2 (ALSA). No music: the game has no MIDI
; synthesizer on the console, and the 2018 game stops if a device fails
; to open.
[Sound Setup]
FXDevice = 0
MusicDevice = -1
