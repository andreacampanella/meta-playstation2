# SPDX-License-Identifier: MIT
#
# kas overlay: the USB drive image with the X desktop (Xorg on the frame
# buffer, the matchbox window manager and panel, rxvt). Use it on top of
# ps2.yml:
#
#   kas build meta-playstation2/kas/ps2.yml:meta-playstation2/kas/x11.yml
#
# The image is build/tmp/deploy/images/ps2/ps2-image-x11-ps2.rootfs.wic.gz.
# On the console, ps2-x starts the desktop.

header:
  version: 14

target: ps2-image-x11
