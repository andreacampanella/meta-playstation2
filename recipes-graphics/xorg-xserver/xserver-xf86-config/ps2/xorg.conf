# The X server on the PlayStation 2.
#
# The fbdev driver draws into /dev/fb0. The kernel keeps those pixels in
# RAM and sends the written rows to the GS (kernel patch 0017). ShadowFB
# is off: /dev/fb0 is in RAM already, so a second copy in the X server
# would only cost time and memory.
#
# The input devices are in /etc/X11/xorg.conf.d/10-ps2-input.conf, which
# ps2-x writes at each start from /proc/bus/input/devices: the init has
# no udev, so the server cannot find them on its own.

Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
EndSection

Section "Device"
	Identifier "GS"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
	Option "ShadowFB" "false"
EndSection

Section "Monitor"
	Identifier "TV"
EndSection

# Depth 15: 16 bits a pixel, half the RAM and half the uploads of depth 24.
Section "Screen"
	Identifier "Screen"
	Device "GS"
	Monitor "TV"
	DefaultDepth 15
	SubSection "Display"
		Depth 15
	EndSubSection
	SubSection "Display"
		Depth 24
	EndSubSection
EndSection

Section "ServerLayout"
	Identifier "Layout"
	Screen "Screen"
EndSection
